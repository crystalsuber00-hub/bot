# Small-account version: XSP (mini-SPX) $2-wide credit spreads held to expiry. Copy to xsp.toml.

broker = "tradier"         # "tradier" or "ibkr"
mode = "signal"            # "signal" = alerts only (paper-tracks the trade); "trade" = also places orders
symbol = "XSP"            # mini-SPX: 1/10 the size of SPX, cash-settled, daily 0DTE
option_root = "XSP"
dte = 0                    # 0 = same-day expiry
state_file = "xsp_state.json"
history_dir = "history_xsp"
poll_seconds = 30
lock_port = 47203          # different from the other bots so they can run together

[schedule]
timezone = "America/New_York"
market_open = "09:30"
entry_delay_minutes = 10   # first look 10 min after the open ...
entry_window_minutes = 5   # ... and last look 15 min after the open

[strategy]
target_delta_min = 0.10    # further out than the SPX default: more wins, smaller credit
target_delta_max = 0.15
target_delta = 0.125
spread_width = 2           # $2 wide XSP: max loss about $185 per contract
min_credit = 0.10          # $10 per contract; skip if less
min_move_pct = 0.0         # ignore days where SPX moved less than this % (0 = always trade)
reference = "open"         # measure the move from today's "open" or "prev_close"
quantity = 1
profit_target = 0.99       # effectively hold to expiry: no same-day close, so no day trade
stop_loss_multiple = 0     # 0 = off. e.g. 2.0 closes if it costs 2x credit to buy back
max_move_pct = 0           # skip if SPX already moved more than this % by entry (0 = off), e.g. 0.6
max_gap_pct = 0            # skip if today gapped more than this % vs prior close (0 = off), e.g. 0.8
pause_after_losses = 2     # after 2 losses in a row ...
pause_days = 3             # ... sit out 3 trading days (0 = off)
skip_dates = []            # days to sit out, e.g. ["2026-10-28"]. Check federalreserve.gov (FOMC) and bls.gov (CPI, jobs)
force_close_time = ""      # hold to the 4:00 cash settlement

[execution]                # only used in mode = "trade"
nudge_seconds = 30         # reprice a working order this often
nudge_step = 0.05          # $/share per reprice
max_nudges = 3
max_entry_concession = 0.03  # entry never accepts less than (mid credit - this)
kill_file = "KILL"         # `touch KILL` = stop entries and flatten everything
max_daily_loss = 0         # off: the spread width already caps the loss
max_total_loss = 0         # $ cumulative realized loss that halts new entries. 0 = off

[tradier]
# token / account_id: prefer env TRADIER_TOKEN and TRADIER_ACCOUNT_ID
sandbox = true

[ibkr]
# Needs IB Gateway or TWS running with the API enabled (see README).
host = "127.0.0.1"
port = 4002                # Gateway paper 4002 / live 4001; TWS paper 7497 / live 7496
client_id = 17
market_data_type = 1       # 1 live, 3 delayed

[notify]
console = true
# telegram_bot_token / telegram_chat_id: prefer env TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# discord_webhook_url: prefer env DISCORD_WEBHOOK_URL
# webhook_url: generic JSON POST of every signal, for your own signal service
# ntfy_topic: prefer env NTFY_TOPIC (use a hard-to-guess name; ntfy.sh topics are public)
# ntfy_server = "https://ntfy.sh"   # or your self-hosted server
# ntfy_token: env NTFY_TOKEN, only for protected topics
