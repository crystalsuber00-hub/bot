# Instagram tokens expire after 60 days. This swaps the token for a fresh one
# every Monday and saves it back as the IG_ACCESS_TOKEN secret.
name: Refresh Instagram token

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh and save the token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the SECRETS_PAT secret (see AUTOPOST.md), or the Instagram token will expire."
            exit 1
          fi
          python autopost/poster.py refresh --out "$RUNNER_TEMP/token"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/token"
          rm -f "$RUNNER_TEMP/token"
