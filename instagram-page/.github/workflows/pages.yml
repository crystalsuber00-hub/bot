# Serves posts/ and reels/ on GitHub Pages so Instagram can download them.
name: Publish media

on:
  push:
    branches: [main]
    paths: ["posts/**", "reels/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect media
        run: |
          mkdir site
          cp -r posts reels site/
          touch site/.nojekyll
          echo "<!doctype html><title>Quietly Leveling media</title>" > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
