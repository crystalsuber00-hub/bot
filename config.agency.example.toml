# smtp_host = "smtp.gmail.com"
# password_env = "MAILBOX2_PASSWORD"
# imap_host = "imap.gmail.com"

[niche_overrides]
# Adjust the average job value for your city, or the price for a niche:
# hvac = { ticket = 550 }
# "hair salon" = { price = 1200 }
