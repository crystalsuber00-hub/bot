# 0DTE option signals on high-volume stocks and ETFs (SPY 0/3 level -> reaction rules).
# Every signal is ONE contract that costs less than $150 at the moment of the signal, expiring the same day,
# and only setups that pass at least 6 of the 7 conviction checks are alerted.
# Copy to stocks.toml and run: spxbot -c stocks.toml     (check first: spxbot -c stocks.toml --check)
# Signal-only: alerts + paper tracking. This model never places orders.

model = "stocks"
broker = "schwab"          # "schwab" or "tradier" (data only)
poll_seconds = 30
lock_port = 47204          # different from the other bots so they can run together

[stocks]
# Any share price is fine. Tickers without an option expiring today are skipped that day.
watchlist = ["SPY", "QQQ", "IWM", "META", "AAPL", "TSLA", "MSFT", "NVDA", "AMZN", "AMD", "GOOGL", "PLTR"]
max_contract_cost = 150    # one contract must cost LESS than this ($1.49 premium or lower)
min_conviction = 6         # of 7 checks: key level, two levels together, first test, with the stock's move,
                           # market (SPY/QQQ) agrees, strong candle, room to run >= 2:1. Lower = more alerts.
market_symbols = ["SPY", "QQQ"]
contracts = 1
state_file = "stocks_state.json"
entry_start = "09:40"      # new signals only in this window (Eastern time), like the 0/3 morning window
entry_end = "11:30"
exit_time = "15:50"        # 0DTE: out before the close
max_trades_per_day = 0     # 0 = no limit: every qualifying setup is sent (one open per ticker)
# At least one signal a day: if nothing qualified yet, the bar drops step by step (labeled LOWER CONVICTION).
min_signals_per_day = 1
fallback_time = "11:00"    # no signal yet -> accept fallback_min_conviction
fallback_min_conviction = 4
fallback_any_time = "11:20"  # still none -> any valid reaction at a level
last_resort_end = "14:00"  # still none after entry_end -> keep looking until this time

# The contract: nearest the money that fits the budget; for pricey stocks it moves further out, but not
# below min_delta (a cheaper, far-out contract is not "less risk", it just expires worthless more often).
min_delta = 0.20
max_delta = 0.60
max_spread_pct = 0.10
premium_target_pct = 0.50   # take profit at +50% on the option
premium_stop_pct = 0.20     # stop at -20% on the option
warn_pct = 0.80             # "almost there" alert at 80% of the way to either

# The reaction, in units of each stock's average 5-min bar range.
touch_atr = 0.2
confirm_atr = 0.2
max_chase_atr = 1.0
stop_atr = 0.8
min_body_ratio = 0.5
min_reward_risk = 1.5

[schwab]
callback_url = "https://127.0.0.1"
token_file = "schwab_token.json"

[notify]
console = true
# phone alerts: NTFY_TOPIC in .env (same as the other bots)
