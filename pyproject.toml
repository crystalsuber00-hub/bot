[project]
name = "spxbot"
version = "0.1.0"
description = "Signal-based SPX credit spread bot (15-20 delta, sells the side away from price, one trade/day)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ibkr = ["ib_async>=1.0"]

[project.scripts]
spxbot = "spxbot.__main__:main"
polyscan = "polyscan.__main__:main"

[tool.setuptools]
packages = ["spxbot", "polyscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
